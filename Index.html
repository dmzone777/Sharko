
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <!-- Google AdSense -->
    <script async 
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3285941469341982"
    crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .ad-box {
            background: #eeeeee;
            border: 1px dashed #999;
            padding: 35px 10px;
            margin: 25px 0;
            text-align: center;
            color: #666;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <main>

        <div class="content">
            <h2>Hello World!</h2>
            <p>This is my first AdSense website.</p>
        </div>

        <!-- Advertisement Space -->
        <div class="ad-box">
            Advertisement Space
        </div>

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
