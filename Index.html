
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkChat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b141a;color:#eee;font-family:Arial,sans-serif}
header{background:#202c33;padding:15px;display:flex;align-items:center;justify-content:space-between}
header h2{margin:0;color:#00a884}
#status{font-size:12px;color:#69dcae}
main{max-width:850px;margin:auto;padding:12px}
.panel{background:#111b21;border-radius:12px;padding:14px;margin-bottom:12px}
input,button{padding:12px;border:0;border-radius:8px;font-size:15px}
input{background:#26343c;color:white;min-width:0}
button{background:#00a884;color:#002c23;font-weight:bold;cursor:pointer}
#name{width:65%}
#messages{height:48vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.msg{background:#26343c;padding:10px;border-radius:10px;max-width:85%;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#005c4b}
.sender{font-size:12px;color:#70dfbd;margin-bottom:5px}
.msg img,.msg video{max-width:100%;max-height:220px}
.msg audio{max-width:100%}
#sendrow{display:flex;gap:7px;margin-top:10px}
#text{flex:1;width:50%}
#people span{display:inline-block;background:#26343c;padding:6px;margin:3px;border-radius:8px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:12px auto}
.cell{height:65px;font-size:26px;background:#26343c;color:white}
small{color:#9aabb4}
</style>
</head>
<body>
<header>
  <div><h2>LinkChat 💬</h2><small>Chat & Play Together</small></div>
  <button id="copy">Copy Link</button>
</header>

<main>
<div class="panel">
  <input id="name" placeholder="Your name" maxlength="24">
  <button id="save">Save</button>
  <p id="status">Connecting...</p>
  <small>Room: <b id="room"></b></small>
</div>

<div class="panel">
  <h3>🟢 People Online</h3>
  <div id="people">Connecting...</div>
</div>

<div class="panel">
  <h3>Messages</h3>
  <div id="messages"></div>
  <div id="sendrow">
    <label for="file" style="font-size:25px;cursor:pointer">＋</label>
    <input id="file" type="file" hidden>
    <input id="text" placeholder="Type a message...">
    <button id="send">Send</button>
  </div>
</div>

<div class="panel">
  <h3>🎮 Play Together</h3>
  <button id="start">Start Tic-Tac-Toe</button>
  <p id="gameStatus">Start a game with room members.</p>
  <div class="board" id="board"></div>
  <button id="reset">New Game</button>
</div>
</main>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged}
 from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
 getDatabase,ref,set,push,onValue,onDisconnect,update
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {
 getStorage,ref as fileRef,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const config={
 apiKey:"AIzaSyAtJzjzNsBvMVj6bOfByWzX21hxSAyLYVQ",
 authDomain:"mini-instagram-95485.firebaseapp.com",
 databaseURL:"https://mini-instagram-95485-default-rtdb.firebaseio.com",
 projectId:"mini-instagram-95485",
 storageBucket:"mini-instagram-95485.firebasestorage.app",
 messagingSenderId:"426906615408",
 appId:"1:426906615408:web:1ba85f1d00b9c09e083eb5",
 measurementId:"G-V8E6NEGGZD"
};

const app=initializeApp(config);
const auth=getAuth(app);
const db=getDatabase(app);
const storage=getStorage(app);

const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const room=(params.get("room")||"lobby").replace(/[^a-z0-9_-]/gi,"");
$("room").textContent=room;

const root="rooms/"+room;
const peopleRef=ref(db,root+"/people");
const chatRef=ref(db,root+"/messages");
const gameRef=ref(db,root+"/game");

let uid=null;
let username=localStorage.getItem("lcname")||
 "Player"+Math.floor(Math.random()*9999);
let game=null;

$("name").value=username;

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function error(e){
 $("status").textContent="Error: "+(e.message||e);
}

$("save").onclick=async()=>{
 username=$("name").value.trim().slice(0,24)||"Player";
 $("name").value=username;
 localStorage.setItem("lcname",username);
 if(uid) await update(ref(db,root+"/people/"+uid),{name:username});
};

$("copy").onclick=async()=>{
 const u=new URL(location.href);
 u.searchParams.set("room",room);
 try{
  await navigator.clipboard.writeText(u.href);
  $("copy").textContent="Copied!";
 }catch{
  prompt("Copy room link:",u.href);
 }
};

function showPeople(data){
 const online=Object.entries(data||{}).filter(
  ([id,p])=>p.online
 );
 $("people").innerHTML=online.map(([id,p])=>
  `<span>🟢 ${esc(p.name)}${id===uid?" (You)":""}</span>`
 ).join("")||"No one online";
 $("status").textContent=online.length+" people online";
}

function showMessages(data){
 const box=$("messages");
 box.innerHTML="";
 Object.values(data||{})
  .sort((a,b)=>(a.time||0)-(b.time||0))
  .slice(-150).forEach(m=>{
   const el=document.createElement("div");
   el.className="msg"+(m.uid===uid?" mine":"");
   let content=`<div>${esc(m.text||"")}</div>`;

   if(m.url){
    if((m.type||"").startsWith("image/"))
      content+=`<img src="${esc(m.url)}">`;
    else if((m.type||"").startsWith("video/"))
      content+=`<video controls src="${esc(m.url)}"></video>`;
    else if((m.type||"").startsWith("audio/"))
      content+=`<audio controls src="${esc(m.url)}"></audio>`;

    content+=`<p><a style="color:#a9f5d8" target="_blank" rel="noopener" href="${esc(m.url)}">${esc(m.fileName||"Download file")}</a></p>`;
   }

   el.innerHTML=`<div class="sender">${esc(m.name)}</div>
    ${content}<small>${m.time?new Date(m.time).toLocaleTimeString():""}</small>`;
   box.appendChild(el);
  });
 box.scrollTop=box.scrollHeight;
}

async function send(text="",file=null){
 if(!uid) return;
 const msg={
  uid,name:username,text,time:Date.now()
 };

 if(file){
  if(file.size>25*1024*1024)
   throw Error("Choose a file smaller than 25 MB.");

  const safe=file.name.replace(/[^a-z0-9._-]/gi,"_");
  const path=`chat-files/${room}/${uid}/${Date.now()}_${safe}`;
  const r=fileRef(storage,path);
  await uploadBytes(r,file,{contentType:file.type||"application/octet-stream"});
  msg.url=await getDownloadURL(r);
  msg.type=file.type;
  msg.fileName=file.name;
 }

 await push(chatRef,msg);
}

$("send").onclick=async()=>{
 const text=$("text").value.trim();
 if(!text)return;
 $("text").value="";
 try{await send(text)}catch(e){error(e)}
};

$("text").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("send").click();
});

$("file").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  await send("",file);
 }catch(err){error(err)}
 e.target.value="";
};

function winner(b){
 for(const [a,c,d] of [
 [0,1,2],[3,4,5],[6,7,8],[0,3,6],
 [1,4,7],[2,5,8],[0,4,8],[2,4,6]
 ]){
  if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
 }
 return b.every(Boolean)?"Draw":null;
}

function renderGame(g){
 game=g||{active:false,board:Array(9).fill(""),turn:"X",players:{}};
 const b=game.board||Array(9).fill("");
 $("board").innerHTML="";

 b.forEach((v,i)=>{
  const btn=document.createElement("button");
  btn.className="cell";
  btn.textContent=v||"";
  btn.disabled=!game.active||!!game.winner||!!v;
  btn.onclick=()=>play(i);
  $("board").appendChild(btn);
 });

 $("gameStatus").textContent=!game.active?"Press Start Game":
 game.winner?(game.winner==="Draw"?"Draw!":game.winner+" wins!"):
 game.turn+"'s turn. You are "+(game.players?.[uid]||"watching");
}

async function startGame(){
 const snap=await new Promise(resolve=>{
  onValue(peopleRef,s=>resolve(s.val()||{}),{onlyOnce:true});
 });
 const ids=Object.entries(snap).filter(([id,p])=>p.online).map(([id])=>id);
 const players={};
 if(ids[0])players[ids[0]]="X";
 if(ids[1])players[ids[1]]="O";

 await set(gameRef,{
  active:true,board:Array(9).fill(""),
  turn:"X",players,winner:null
 });
}

async function play(i){
 if(!game?.active||game.winner||game.board[i])return;
 if(game.players?.[uid]!==game.turn)return;

 const b=[...game.board];
 b[i]=game.turn;
 const w=winner(b);

 await update(gameRef,{
  board:b,
  turn:game.turn==="X"?"O":"X",
  winner:w
 });
}

$("start").onclick=()=>startGame().catch(error);
$("reset").onclick=()=>startGame().catch(error);

signInAnonymously(auth).catch(error);

onAuthStateChanged(auth,async user=>{
 if(!user)return;
 uid=user.uid;

 try{
  const me=ref(db,root+"/people/"+uid);
  await set(me,{name:username,online:true});
  onDisconnect(me).update({online:false});
  onValue(peopleRef,showPeople);
  onValue(chatRef,showMessages);
  onValue(gameRef,s=>renderGame(s.val()));
 }catch(e){error(e)}
});
</script>
</body>
</html>
